<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>textlite</title>
 <style>
        /* Cyberpunk Neon Theme */
        body { 
            font-family: 'Courier New', Courier, monospace; 
            margin: 20px; 
            background: #0d0e15; /* Deep cyber-black/blue */
            color: #39ff14; /* Neon Green */
        }

        h3 {
            color: #00ffff; /* Neon Cyan for headers */
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            margin-top: 0;
        }

        #setup, #chat-room { 
            max-width: 500px; 
            background: #161925; /* Dark container */
            padding: 20px; 
            border-radius: 8px; 
            border: 2px solid #ff007f; /* Neon Pink Border */
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
        }

        #chat-box { 
            width: 100%; 
            max-width: 500px; 
            height: 350px; 
            border: 1px solid #39ff14; 
            background: #05060a; 
            overflow-y: scroll; 
            padding: 10px; 
            margin-bottom: 15px; 
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* Message Styles */
        .system { 
            color: #ff007f; /* Pink for system alerts */
            font-style: italic; 
            font-size: 0.9em; 
            margin: 8px 0; 
        }

        .msg { 
            margin: 8px 0; 
            word-wrap: break-word;
        }

        .msg-user { 
            font-weight: bold; 
            color: #00ffff; /* Cyan for user handles */
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
        }

        /* Form Elements */
        input { 
            padding: 12px; 
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px; 
            border-radius: 4px; 
            border: 1px solid #39ff14; 
            background: #161925;
            color: #39ff14;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
        }

        button { 
            padding: 12px 20px; 
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 16px; 
            border-radius: 4px; 
            background: #39ff14; 
            color: #0d0e15;
            border: none; 
            cursor: pointer; 
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
        }

        button:hover {
            background: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        }

        .hidden { display: none; }
        
        /* Flexbox layout to make input and button align perfectly */
        .input-group {
            display: flex;
            gap: 10px;
        }
        .input-group input {
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div id="setup">
        <h3>Enter a Username</h3>
        <input type="text" id="username" placeholder="Your name...">
        <button onclick="joinChat()">Enter Chat</button>
    </div>

    <div id="chat-room" class="hidden">
        <h3 id="room-title">Room: </h3>
        <div id="chat-box"></div>
        <input type="text" id="message" placeholder="Type a message..." style="width: 70%;">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // Automatically extract room name from URL query parameter '?room=xyz'
        // If no room is provided, default to 'lobby'
        const urlParams = new URLSearchParams(window.location.search);
        const roomName = urlParams.get('room') || 'lobby';
        
        document.getElementById('room-title').innerText = `Room: ${roomName}`;

        let ws;
        let username;

        function joinChat() {
            username = document.getElementById('username').value.trim();
            if (!username) return alert("Please enter a username!");

            // Hide login, show chat
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('chat-room').classList.remove('hidden');

            // Establish WebSocket connection dynamically based on current host
            const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(`${wsProtocol}${window.location.host}`);

            ws.onopen = () => {
                // Tell the server who we are and what room we want
                ws.send(JSON.stringify({ type: 'join', room: roomName, username: username }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const chatBox = document.getElementById('chat-box');

                if (data.type === 'system') {
                    chatBox.innerHTML += `<div class="system">${data.text}</div>`;
                } else if (data.type === 'message') {
                    chatBox.innerHTML += `<div class="msg"><span class="msg-user">${data.user}:</span> ${data.text}</div>`;
                }
                chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll to bottom
            };
        }

        function sendMessage() {
            const input = document.getElementById('message');
            const text = input.value.trim();
            if (!text) return;

            ws.send(JSON.stringify({ type: 'chat', text: text }));
            input.value = '';
        }

        // Allow pressing Enter key to send
        document.getElementById('message').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
